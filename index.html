<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吉他練習回饋 · M0 和弦辨識</title>
<style>
  :root{
    --ground:#0e1116; --panel:#161b24; --panel-2:#1e2430;
    --ink:#e8ebf0; --muted:#95a0b0; --line:#2a3242;
    --ok:#4fbf87; --bad:#e0736a; --wait:#e0a45c; --brand:#5fa8d3;
    --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
    --sans:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 24px}

  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
  button{font-family:inherit;font-size:.92rem;font-weight:600;padding:10px 18px;
         border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
         color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--brand)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--brand);border-color:var(--brand);color:#06121b}
  button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  .status{font-family:var(--mono);font-size:.82rem;color:var(--muted)}

  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:26px;margin-bottom:18px}
  .target{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .target label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;
                text-transform:uppercase;color:var(--muted)}
  select{font-family:inherit;font-size:1rem;padding:7px 12px;border-radius:7px;
         background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}

  .readout{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
  @media(max-width:560px){.readout{grid-template-columns:1fr}}
  .heard{font-size:4rem;font-weight:800;line-height:1;font-family:var(--mono);
         letter-spacing:-.02em}
  .heard.ok{color:var(--ok)} .heard.bad{color:var(--bad)} .heard.wait{color:var(--muted)}
  .verdict{font-size:1.05rem;font-weight:700}
  .detail{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-top:6px}

  .meter{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;
         margin-top:14px}
  .meter i{display:block;height:100%;background:var(--brand);width:0;
           transition:width .08s linear}

  .chroma{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:22px}
  .chroma div{text-align:center}
  .chroma .col{height:76px;background:var(--panel-2);border-radius:4px;
               position:relative;overflow:hidden}
  .chroma .col i{position:absolute;bottom:0;left:0;right:0;background:var(--brand);
                 height:0;transition:height .1s linear}
  .chroma .col.want i{background:var(--ok)}
  .chroma span{font-family:var(--mono);font-size:.62rem;color:var(--muted);
               display:block;margin-top:5px}
  .chroma .lbl.want{color:var(--ok);font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:6px}
  th{text-align:left;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;
     text-transform:uppercase;color:var(--muted);padding-bottom:8px;font-weight:600}
  td{padding:7px 0;border-top:1px solid var(--line);font-family:var(--mono)}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:18px 22px;font-size:.88rem;color:var(--muted)}
  .note b{color:var(--ink)}
  code{background:var(--panel-2);padding:2px 6px;border-radius:4px;font-family:var(--mono);
       font-size:.85em}
</style>
</head>
<body>
<div class="wrap">

  <h1>吉他練習回饋 · M0</h1>
  <p class="sub">用聽的判斷和弦按對沒有 —— 不用鏡頭，不受角度與遮擋影響。</p>

  <div class="bar">
    <button id="start" class="primary">開始聆聽</button>
    <button id="stop" disabled>停止</button>
    <button id="demo">播放合成 Em（不用吉他也能測）</button>
    <span id="status" class="status">尚未啟動</span>
  </div>

  <div class="stage">
    <div class="target">
      <label for="want">練習目標</label>
      <select id="want"></select>
      <span id="wantNotes" class="status"></span>
    </div>

    <div class="readout">
      <div>
        <div id="heard" class="heard wait">—</div>
        <div id="verdict" class="verdict" style="color:var(--muted)">等待聲音</div>
        <div id="detail" class="detail">分數 —　領先 —</div>
      </div>
      <div style="min-width:190px">
        <table>
          <thead><tr><th>可能的和弦</th><th style="text-align:right">相似度</th></tr></thead>
          <tbody id="ranked"><tr><td colspan="2" style="color:var(--muted)">—</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="meter"><i id="level"></i></div>

    <div class="chroma" id="chroma"></div>
  </div>

  <div class="note">
    <b>怎麼用：</b>按「開始聆聽」允許麥克風，選一個目標和弦，對著手機/電腦刷弦，讓它響滿一拍。
    綠色代表聽到的跟目標一致。<br><br>
    <b>沒有吉他也能驗證：</b>按「播放合成 Em」，程式會自己合成一個帶泛音的 Em 和弦播出來，
    麥克風收到後應該判定為 Em。<br><br>
    <b>下方 12 個柱子</b>是 chroma —— 目前聽到的十二個音級各有多少能量。
    綠色柱子是目標和弦「應該」出現的音。看柱子比看結論更能理解它為什麼這樣判。
  </div>

</div>

<script type="module">
import { computeChroma, identify, chordNotes, CHORD_TEMPLATES, NOTE_NAMES }
  from './src/chroma.js';

const $ = id => document.getElementById(id);
const FFT = 8192;

// ── 目標和弦下拉 ──────────────────────────────────────────────────────────────
const want = $('want');
for (const name of Object.keys(CHORD_TEMPLATES)) {
  const o = document.createElement('option');
  o.value = o.textContent = name;
  want.appendChild(o);
}
want.value = 'Em';

// ── chroma 柱狀圖 ────────────────────────────────────────────────────────────
const chromaEl = $('chroma');
const cols = [], lbls = [];
NOTE_NAMES.forEach(n => {
  const wrap = document.createElement('div');
  const col = document.createElement('div'); col.className = 'col';
  const fill = document.createElement('i');
  col.appendChild(fill);
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = n;
  wrap.append(col, lbl);
  chromaEl.appendChild(wrap);
  cols.push({ col, fill }); lbls.push(lbl);
});

function paintTarget() {
  const wanted = new Set(chordNotes(want.value));
  cols.forEach(({ col }, i) => col.classList.toggle('want', wanted.has(NOTE_NAMES[i])));
  lbls.forEach((l, i) => l.classList.toggle('want', wanted.has(NOTE_NAMES[i])));
  $('wantNotes').textContent = '應含 ' + chordNotes(want.value).join(' · ');
}
want.addEventListener('change', paintTarget);
paintTarget();

// ── 音訊 ─────────────────────────────────────────────────────────────────────
let ctx = null, analyser = null, stream = null, raf = 0;

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    $('status').textContent = '麥克風被拒絕或無法使用：' + e.name;
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = FFT;
  analyser.smoothingTimeConstant = 0.6;
  ctx.createMediaStreamSource(stream).connect(analyser);

  $('start').disabled = true; $('stop').disabled = false;
  $('status').textContent = `聆聽中 · ${ctx.sampleRate}Hz · FFT ${FFT}`;
  loop();
}

function stop() {
  cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  ctx = analyser = stream = null;
  $('start').disabled = false; $('stop').disabled = true;
  $('status').textContent = '已停止';
  $('heard').textContent = '—'; $('heard').className = 'heard wait';
  $('verdict').textContent = '等待聲音'; $('verdict').style.color = 'var(--muted)';
}

const spec = new Float32Array(FFT / 2);

function loop() {
  raf = requestAnimationFrame(loop);
  analyser.getFloatFrequencyData(spec);

  // dB → 線性振幅；-100dB 以下當雜訊丟掉
  const mag = new Float32Array(spec.length);
  let energy = 0;
  for (let i = 0; i < spec.length; i++) {
    const v = spec[i] > -100 ? Math.pow(10, spec[i] / 20) : 0;
    mag[i] = v; energy += v;
  }

  $('level').style.width = Math.min(100, energy * 2200) + '%';

  // 太安靜就不判斷 —— 免得對著空氣亂猜
  if (energy < 0.014) {
    $('heard').textContent = '—'; $('heard').className = 'heard wait';
    $('verdict').textContent = '太安靜，彈一下'; $('verdict').style.color = 'var(--muted)';
    cols.forEach(c => c.fill.style.height = '0%');
    return;
  }

  const chroma = computeChroma(mag, ctx.sampleRate, FFT);
  cols.forEach((c, i) => c.fill.style.height = (chroma[i] * 100).toFixed(1) + '%');

  const r = identify(chroma);
  const target = want.value;

  const heard = $('heard'), verdict = $('verdict');
  if (!r.confident) {
    heard.textContent = r.chord + '?'; heard.className = 'heard wait';
    verdict.textContent = '聽不確定 — 讓和弦響久一點';
    verdict.style.color = 'var(--wait)';
  } else if (r.chord === target) {
    heard.textContent = r.chord; heard.className = 'heard ok';
    verdict.textContent = '正確';
    verdict.style.color = 'var(--ok)';
  } else {
    heard.textContent = r.chord; heard.className = 'heard bad';
    verdict.textContent = `聽起來像 ${r.chord}，目標是 ${target}`;
    verdict.style.color = 'var(--bad)';
  }
  $('detail').textContent =
    `分數 ${r.score.toFixed(3)}　領先 ${r.margin.toFixed(3)}`;

  $('ranked').innerHTML = r.ranked.map(x =>
    `<tr><td>${x.chord}</td><td style="text-align:right">${x.score.toFixed(3)}</td></tr>`
  ).join('');
}

// ── 合成測試音：不用吉他也能驗證整條鏈路 ──────────────────────────────────────
function playDemo() {
  const a = new (window.AudioContext || window.webkitAudioContext)();
  const notes = [82.41, 123.47, 164.81, 196.00, 246.94, 329.63];  // Em: E2 B2 E3 G3 B3 E4
  const now = a.currentTime;
  notes.forEach((f, i) => {
    for (let h = 1; h <= 4; h++) {
      const osc = a.createOscillator(), g = a.createGain();
      osc.frequency.value = f * h;
      const t0 = now + i * 0.012;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.16 / (h * h), t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
      osc.connect(g); g.connect(a.destination);
      osc.start(t0); osc.stop(t0 + 2.5);
    }
  });
  setTimeout(() => a.close(), 3000);
  $('status').textContent = '播放合成 Em 中 — 麥克風應判定為 Em';
}

$('start').addEventListener('click', start);
$('stop').addEventListener('click', stop);
$('demo').addEventListener('click', playDemo);
</script>
</body>
</html>
